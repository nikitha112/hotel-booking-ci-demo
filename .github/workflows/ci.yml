
name: Hotel Booking ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train hotel booking model
        run: python train_model.py

      - name: Run ML pipeline tests
        run: python -m unittest test_ml_pipeline -v

      - name: Display model metrics
        run: cat artifacts/metrics.json
